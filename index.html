async function handleVote(type){
  if(voting||!activeVideoRef)return; voting=true;
  document.getElementById('likeBtn').disabled=true; document.getElementById('dislikeBtn').disabled=true;
  try{
    const prev=currentVote,updates={};
    if(prev===type){
      updates[type==='liked'?'likes':'dislikes']=increment(-1);
      currentVote=null;localStorage.removeItem('vote_'+activeVideoId);
      if(type==='liked')currentLikes=Math.max(0,currentLikes-1);else currentDislikes=Math.max(0,currentDislikes-1);
      showToast(type==='liked'?'👍 Like removed':'👎 Dislike removed');
    }else{
      updates[type==='liked'?'likes':'dislikes']=increment(1);
      if(prev==='liked'){updates.likes=increment(-1);currentLikes=Math.max(0,currentLikes-1);}
      if(prev==='disliked'){updates.dislikes=increment(-1);currentDislikes=Math.max(0,currentDislikes-1);}
      currentVote=type;localStorage.setItem('vote_'+activeVideoId,type);
      if(type==='liked')currentLikes++;else currentDislikes++;
      showToast(type==='liked'?'👍 Liked!':'👎 Disliked');
    }
    await updateDoc(activeVideoRef,updates);updateVoteUI();
  }catch(e){console.error(e);showToast('⚠️ Failed. Try again.');}
  finally{voting=false;document.getElementById('likeBtn').disabled=false;document.getElementById('dislikeBtn').disabled=false;}
}

document.getElementById('wlBtn').addEventListener('click',()=>{
  if(!activeVideoId)return;
  const btn=document.getElementById('wlBtn'),saved=localStorage.getItem('wl_'+activeVideoId)==='1';
  if(saved){localStorage.removeItem('wl_'+activeVideoId);btn.className='wl-btn';showToast('🔖 Removed');}
  else{localStorage.setItem('wl_'+activeVideoId,'1');btn.className='wl-btn saved';showToast('🔖 Saved');}
});

/* ── RENDER GRID ── */
function renderVideos() {
  let list = [...allVideos];
  if (state.channel) list = list.filter(v => getCh(v).toLowerCase()===state.channel.toLowerCase());
  if (state.search) { const q=state.search.toLowerCase(); list=list.filter(v=>(v.title||'').toLowerCase().includes(q)||(v.description||'').toLowerCase().includes(q)||(v.keywords||'').toLowerCase().includes(q)||getCh(v).toLowerCase().includes(q)); }
  if (state.sort==='mostviews') list.sort((a,b)=>{ const va=parseInt(String(a.views||0).replace(/\D/g,""))||0,vb=parseInt(String(b.views||0).replace(/\D/g,""))||0; return vb-va; });

  const bar=document.getElementById('statusBar'),txt=document.getElementById('statusText'),lbl=document.getElementById('listLabel');
  if (state.search) { bar.classList.add('show'); txt.innerHTML=`Results for <strong>"${state.search}"</strong> (${list.length})`; lbl.textContent='Search Results'; }
  else if (state.channel) { bar.classList.add('show'); txt.innerHTML=`Channel: <strong>${state.channel}</strong> (${list.length})`; lbl.textContent=state.channel; }
  else if (state.sort==='mostviews') { bar.classList.add('show'); txt.innerHTML=`Sorted by <strong>🔥 Most Views</strong>`; lbl.textContent='Most Viewed'; }
  else { bar.classList.remove('show'); lbl.textContent='All Videos'; }

  const el=document.getElementById('videoList');
  if(!list.length){el.innerHTML='<div class="empty"><div class="empty-icon">🎬</div><div>No videos found</div></div>';return;}
  el.innerHTML=list.map(v=>{
    const ch=getCh(v);
    return `<div class="video-card" data-id="${v.id}" data-preview="${v.preview||''}">
      <div class="thumb-wrap" data-preview="${v.preview||''}">
        <img src="${v.thumb||''}" alt="${(v.title||'').replace(/"/g,'&quot;')}" loading="lazy" onerror="this.src='https://placehold.co/640x360/13162a/444?text=Video'" />
        <div class="badge-4k">4K</div>
        ${v.duration?`<div class="duration-badge">${v.duration}</div>`:''}
      </div>
      <div class="card-info">
        <div class="card-title">${v.title||''}</div>
        <div class="card-meta">
          <div class="ch-tag"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="15" rx="2"/><polyline points="17 2 12 7 7 2"/></svg>${ch||'Channel'}</div>
          <div class="views"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>${fmtNum(v.views||0)}</div>
        </div>
      </div>
    </div>`;
  }).join('');
  attachCardEvents(list);
}

function attachCardEvents(list) {
  document.querySelectorAll('.video-card').forEach(card => {
    const id=card.dataset.id,previewUrl=card.dataset.preview,thumb=card.querySelector('.thumb-wrap');
    let previewEl=null,touchTimer=null,touchMoved=false;
    function showP(){if(!previewUrl||previewEl)return;previewEl=document.createElement('video');previewEl.src=previewUrl;previewEl.autoplay=true;previewEl.muted=true;previewEl.loop=true;previewEl.playsInline=true;previewEl.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1';const b=document.createElement('div');b.className='preview-badge';b.style.zIndex='3';b.innerHTML='<span class="preview-dot"></span>PREVIEW';b.id='pb_'+id;thumb.appendChild(previewEl);thumb.appendChild(b);}
    function hideP(){if(previewEl){previewEl.remove();previewEl=null;}const pb=document.getElementById('pb_'+id);if(pb)pb.remove();}
    thumb.addEventListener('mouseenter',showP);
    thumb.addEventListener('mouseleave',hideP);
    thumb.addEventListener('touchstart',()=>{touchMoved=false;touchTimer=setTimeout(()=>{if(!touchMoved)showP();},150);},{passive:true});
    thumb.addEventListener('touchmove',()=>{touchMoved=true;if(touchTimer)clearTimeout(touchTimer);hideP();},{passive:true});
    thumb.addEventListener('touchend',()=>{if(touchTimer)clearTimeout(touchTimer);setTimeout(hideP,600);},{passive:true});
    thumb.addEventListener('touchcancel',()=>{if(touchTimer)clearTimeout(touchTimer);hideP();},{passive:true});
    card.addEventListener('click',()=>{
      const v=list.find(x=>x.id===id)||allVideos.find(x=>x.id===id);
      if(v)loadPlayer(v);
    });
  });
}

/* ── CHANNEL BAR ── */
function buildChannelBar() {
  const chMap=new Map();
  allVideos.forEach(v=>{const c=getCh(v);if(c&&!chMap.has(c.toLowerCase()))chMap.set(c.toLowerCase(),c);});
  const channels=[...chMap.values()].sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()));
  const bar=document.getElementById('channelBar');
  bar.innerHTML=`<button class="ch-btn active" data-channel="">All</button>`+channels.map(ch=>`<button class="ch-btn" data-channel="${ch}">${ch}</button>`).join('');
  bar.addEventListener('click',e=>{
    const btn=e.target.closest('.ch-btn');if(!btn)return;
    bar.querySelectorAll('.ch-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state={channel:btn.dataset.channel,search:'',sort:'latest'};
    document.getElementById('searchInput').value='';
    renderVideos();
  });
  const catList=document.getElementById('catList');
  catList.innerHTML=channels.map(ch=>`<button class="cat-item" data-ch="${ch}">${ch}</button>`).join('');
  catList.querySelectorAll('.cat-item').forEach(b=>b.addEventListener('click',()=>{
    state={channel:b.dataset.ch,search:'',sort:'latest'};
    bar.querySelectorAll('.ch-btn').forEach(x=>x.classList.remove('active'));
    const target=bar.querySelector(`.ch-btn[data-channel="${b.dataset.ch}"]`);
    if(target)target.classList.add('active');else bar.querySelector('.ch-btn').classList.add('active');
    closeDropdown();renderVideos();
  }));
}

/* ── DROPDOWN ── */
const dropdown=document.getElementById('dropdown'),menuBtn=document.getElementById('menuBtn');
const catList=document.getElementById('catList'),catChevron=document.getElementById('catChevron');
let dropOpen=false,catOpen=false;
function closeDropdown(){dropOpen=false;catOpen=false;dropdown.classList.remove('open');catList.classList.remove('open');catChevron.classList.remove('open');}
menuBtn.addEventListener('click',e=>{e.stopPropagation();dropOpen=!dropOpen;dropdown.classList.toggle('open',dropOpen);if(!dropOpen){catOpen=false;catList.classList.remove('open');catChevron.classList.remove('open');}});
document.getElementById('catToggle').addEventListener('click',e=>{e.stopPropagation();catOpen=!catOpen;catList.classList.toggle('open',catOpen);catChevron.classList.toggle('open',catOpen);});
document.addEventListener('click',e=>{if(!document.getElementById('menuWrap').contains(e.target))closeDropdown();});
document.getElementById('sortLatest').addEventListener('click',()=>{state={channel:'',search:'',sort:'latest'};document.getElementById('channelBar').querySelector('.ch-btn').click();closeDropdown();renderVideos();});
document.getElementById('sortViews').addEventListener('click',()=>{state={channel:'',search:'',sort:'mostviews'};document.getElementById('channelBar').querySelectorAll('.ch-btn').forEach(b=>b.classList.remove('active'));document.getElementById('channelBar').querySelector('.ch-btn').classList.add('active');closeDropdown();renderVideos();});

/* ── SEARCH ── */
const searchBar=document.getElementById('searchBar'),searchInput=document.getElementById('searchInput'),searchClear=document.getElementById('searchClear');
document.getElementById('searchBtn').addEventListener('click',()=>{searchBar.classList.toggle('open');if(searchBar.classList.contains('open'))setTimeout(()=>searchInput.focus(),60);});
searchInput.addEventListener('input',()=>{searchClear.style.display=searchInput.value?'flex':'none';});
searchClear.addEventListener('click',()=>{searchInput.value='';searchClear.style.display='none';searchInput.focus();});
document.getElementById('searchForm').addEventListener('submit',e=>{
  e.preventDefault();const q=searchInput.value.trim();if(!q)return;
  state={channel:'',search:q,sort:'latest'};
  document.getElementById('channelBar').querySelectorAll('.ch-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('channelBar').querySelector('.ch-btn').classList.add('active');
  renderVideos();searchBar.classList.remove('open');searchInput.value='';searchClear.style.display='none';
});
document.getElementById('clearBtn').addEventListener('click',()=>{
  state={channel:'',search:'',sort:'latest'};
  document.getElementById('channelBar').querySelectorAll('.ch-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('channelBar').querySelector('.ch-btn').classList.add('active');
  renderVideos();
});

/* ── INIT ── */
(async()=>{
  try {
    const snap=await getDocs(collection(db,'videos'));
    allVideos=snap.docs.map(d=>({id:d.id,...d.data()}));
    buildChannelBar();
    renderVideos();
  } catch(e) {
    document.getElementById('videoList').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><div>Failed to load videos</div></div>';
    console.error(e);
  }
})();
</script>
