<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - Desi4KPorn</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0d0f18;--card:#13162a;--border:#1e2234;--gold:#f5c518;--text:#e8e8e8;--red:#dc2626;--blue:#2563eb;--green:#16a34a}
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#2a2d3a;border-radius:2px}

    /* LOGIN */
    .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .login-box{width:100%;max-width:360px}
    .login-logo{text-align:center;margin-bottom:28px}
    .login-logo img{height:50px;object-fit:contain}
    .login-sub{color:#666;font-size:13px;margin-top:8px}
    .login-card{background:var(--card);border-radius:14px;padding:28px;border:1px solid var(--border)}
    .login-title{font-size:15px;font-weight:600;color:#ddd;margin-bottom:20px;text-align:center}
    input[type=password],input[type=text],input[type=url],input[type=number],textarea,select{
      width:100%;padding:10px 12px;border-radius:8px;background:#0d0f18;border:1px solid var(--border);
      color:var(--text);font-size:13px;outline:none;transition:border .2s;font-family:inherit}
    input:focus,textarea:focus,select:focus{border-color:#3a3d4a}
    input.err{border-color:var(--red)}
    .err-msg{color:#f87171;font-size:12px;margin-top:5px}
    .btn-gold{width:100%;padding:13px;background:var(--gold);color:#111;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:14px;transition:opacity .2s}
    .btn-gold:hover{opacity:.9}
    .btn-gold:disabled{opacity:.5;cursor:not-allowed}

    /* HEADER */
    header{background:#090b14;border-bottom:1px solid var(--border);height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:40}
    .h-left{display:flex;align-items:center;gap:12px}
    .h-left img{height:38px;object-fit:contain;max-width:160px}
    .admin-badge{background:#1e1a00;color:var(--gold);font-size:12px;font-weight:700;padding:3px 10px;border-radius:6px;border:1px solid #f5c51840;white-space:nowrap}
    .h-btns{display:flex;gap:8px}
    .btn-add{display:flex;align-items:center;gap:6px;background:var(--gold);color:#111;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700}
    .btn-logout{display:flex;align-items:center;gap:5px;background:#1e2234;color:#999;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px}
    svg.icon{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle}

    /* TABS */
    .tabs{display:flex;border-bottom:1px solid var(--border);padding:0 16px;background:#090b14}
    .tab-btn{padding:12px 18px;border:none;background:none;color:#666;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
    .tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}

    .main{max-width:860px;margin:0 auto;padding:16px}

    /* FORM */
    .form-card{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:20px;margin-bottom:20px}
    .form-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
    .form-title{font-size:15px;font-weight:600;color:#eee}
    .btn-close{background:none;border:none;cursor:pointer;color:#666;padding:4px;display:flex}
    .form-grid{display:grid;gap:12px}
    .field-label{font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px}
    .form-actions{display:flex;gap:10px;margin-top:18px}
    .btn-save{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--gold);color:#111;border:none;padding:12px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
    .btn-save:disabled{background:#555;cursor:not-allowed;color:#aaa}
    .btn-cancel{background:#1e2234;color:#999;border:none;padding:12px 20px;border-radius:10px;cursor:pointer;font-size:14px}

    /* VIDEO LIST */
    .list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
    .list-count{color:#888;font-size:13px}
    .btn-refresh{background:none;border:none;cursor:pointer;color:#666;font-size:12px}
    .video-list{display:flex;flex-direction:column;gap:8px}
    .video-item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;transition:border .2s}
    .video-item.editing{border-color:var(--gold);background:#1a1f38}
    .video-item.selected{border-color:#2563eb;background:#0f1628}
    .video-thumb{width:72px;height:42px;object-fit:cover;border-radius:5px;flex-shrink:0;background:#111}
    .video-meta{flex:1;min-width:0}
    .video-title{font-size:13px;font-weight:500;color:#ddd;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
    .video-sub{display:flex;gap:10px;margin-top:3px;font-size:11px;color:#666;flex-wrap:wrap}
    .item-btns{display:flex;gap:6px;flex-shrink:0}
    .btn-icon{display:flex;align-items:center;padding:7px;border-radius:7px;border:none;cursor:pointer}
    .btn-view{background:#1a2040;color:#888;text-decoration:none}
    .btn-edit{background:#1a2040;color:var(--gold)}
    .btn-del{background:#2a1020;color:var(--red)}
    .btn-icon:disabled{opacity:.4;cursor:not-allowed}

    /* CHECKBOX */
    .cb-wrap{flex-shrink:0}
    .cb-wrap input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue);cursor:pointer;border-radius:4px}

    /* BULK BAR */
    .bulk-bar{background:#0f1628;border:1px solid #2563eb;border-radius:12px;padding:12px 16px;margin-bottom:14px;display:none;align-items:center;gap:12px;flex-wrap:wrap}
    .bulk-bar.show{display:flex}
    .bulk-count{color:#60a5fa;font-size:13px;font-weight:600;flex:1}
    .btn-bulk-assign{display:flex;align-items:center;gap:6px;background:#2563eb;color:#fff;border:none;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
    .btn-bulk-cancel{background:#1e2234;color:#999;border:none;padding:9px 14px;border-radius:8px;cursor:pointer;font-size:13px}
    .select-all-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
    .select-all-row label{color:#888;font-size:13px;cursor:pointer}

    /* MODAL */
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
    .modal-bg.show{display:flex}
    .modal{background:var(--card);border-radius:16px;padding:24px;width:100%;max-width:420px;border:1px solid var(--border)}
    .modal-title{font-size:15px;font-weight:700;color:#eee;margin-bottom:6px}
    .modal-sub{font-size:12px;color:#666;margin-bottom:18px}
    .input-row{display:flex;gap:10px;align-items:center;margin-bottom:12px}
    .input-row input,.input-row select{flex:1}
    .or-divider{text-align:center;color:#444;font-size:12px;margin:10px 0;position:relative}
    .or-divider::before,.or-divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:#1e2234}
    .or-divider::before{left:0}.or-divider::after{right:0}
    .modal-actions{display:flex;gap:10px;margin-top:18px}
    .btn-modal-confirm{flex:1;background:var(--gold);color:#111;border:none;padding:12px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
    .btn-modal-cancel{background:#1e2234;color:#999;border:none;padding:12px 18px;border-radius:10px;cursor:pointer;font-size:14px}

    /* CATEGORIES TAB */
    .cat-section{display:none}
    .cat-section.active{display:block}
    .cat-add-card{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:20px;margin-bottom:20px}
    .cat-add-title{font-size:14px;font-weight:600;color:#eee;margin-bottom:14px}
    .cat-add-row{display:flex;gap:10px}
    .cat-add-row input{flex:1}
    .btn-green{background:#16a34a;color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;white-space:nowrap}
    .cat-list-card{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:20px}
    .cat-list-title{font-size:14px;font-weight:600;color:#eee;margin-bottom:14px}
    .cat-items{display:flex;flex-direction:column;gap:8px}
    .cat-item{display:flex;align-items:center;gap:12px;background:#0d0f18;border:1px solid var(--border);border-radius:10px;padding:10px 14px}
    .cat-name{flex:1;font-size:14px;color:#ddd;font-weight:500}
    .cat-count{color:#555;font-size:12px}
    .cat-edit-input{flex:1;display:none}
    .cat-actions{display:flex;gap:6px}
    .btn-cat-edit{background:#1a2040;color:var(--gold);border:none;padding:7px 12px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600}
    .btn-cat-save{background:#16a34a;color:#fff;border:none;padding:7px 12px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;display:none}
    .btn-cat-del{background:#2a1020;color:var(--red);border:none;padding:7px 12px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600}

    .skeleton{background:#1a1d2a;border-radius:10px;animation:sk 1.5s ease-in-out infinite}
    @keyframes sk{0%,100%{opacity:1}50%{opacity:.5}}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spinning{animation:spin .8s linear infinite}

    .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1e2234;color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;z-index:999;border:1px solid #2a2d3a;white-space:nowrap;display:none}
    .toast.show{display:block}
  </style>
</head>
<body>

<div id="toast" class="toast"></div>

<!-- ASSIGN CATEGORY MODAL -->
<div class="modal-bg" id="assignModal">
  <div class="modal">

<!-- ADMIN -->
<div id="adminSection" style="display:none">
  <header>

      <div id="formCard" class="form-card" style="display:none">

      <!-- Bulk Bar -->

          <svg class="icon" viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          Assign Category

      <!-- List header -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, deleteDoc, updateDoc, doc, serverTimestamp, orderBy, query, writeBatch } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

const PASS = "Admin@4k2024";
const SK   = "adm_sess_4k";

const app = initializeApp({
  apiKey:"AIzaSyBYNU7wTq9_1-TdIVuG-yxAlKjeFb9Rm_M",
  authDomain:"video-cms-b7c1e.firebaseapp.com",
  projectId:"video-cms-b7c1e",
  storageBucket:"video-cms-b7c1e.firebasestorage.app",
  messagingSenderId:"991575420179",
  appId:"1:991575420179:web:23459a09aa36f868e37ee6"
});
const db = getFirestore(app);

let videos = [], editId = null, selectedIds = new Set();
let extraCategories = []; // categories added via Categories tab
let currentTab = 'videos';

/* ── TOAST ── */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

/* ── HELPERS ── */
const getCh  = v => (v.channel || v.tag || '').trim();
const fmtNum = n => { n = parseInt(n) || 0; if (n >= 1e6) return (n/1e6).toFixed(1)+'M'; if (n >= 1e3) return (n/1e3).toFixed(0)+'K'; return String(n); };
function getAllCategories() {
  const map = new Map();
  videos.forEach(v => { const c = getCh(v); if (c) map.set(c.toLowerCase(), c); });
  extraCategories.forEach(c => { if (c && !map.has(c.toLowerCase())) map.set(c.toLowerCase(), c); });
  return [...map.values()].sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
}
function populateCatDropdowns() {
  const cats = getAllCategories();
  const opts = ['<option value="">— Pick existing —</option>', ...cats.map(c => `<option value="${c}">${c}</option>`)].join('');
  document.getElementById('f-channel-pick').innerHTML = opts;
  const opts2 = ['<option value="">— Select existing —</option>', ...cats.map(c => `<option value="${c}">${c}</option>`)].join('');
  document.getElementById('existingCatSelect').innerHTML = opts2;
}

/* ── LOGIN ── */
window.doLogin = function() {
  const val = document.getElementById('passInput').value;
  if (val === PASS) {
    sessionStorage.setItem(SK, '1');
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('adminSection').style.display = 'block';
    fetchVideos();
  } else {
    const pi = document.getElementById('passInput');
    pi.classList.add('err');
    document.getElementById('passErr').style.display = 'block';
    setTimeout(() => { pi.classList.remove('err'); document.getElementById('passErr').style.display = 'none'; }, 2000);
  }
};
document.getElementById('passInput').addEventListener('keydown', e => { if (e.key === 'Enter') window.doLogin(); });

window.doLogout = function() {
  sessionStorage.removeItem(SK);
  location.href = 'index.html';
};

if (sessionStorage.getItem(SK) === '1') {
  document.getElementById('loginSection').style.display = 'none';
  document.getElementById('adminSection').style.display = 'block';
  fetchVideos();
}

/* ── TABS ── */
window.switchTab = function(tab) {
  currentTab = tab;
  document.getElementById('tab-videos').classList.toggle('active', tab === 'videos');
  document.getElementById('tab-categories').classList.toggle('active', tab === 'categories');
  document.getElementById('videosTab').style.display     = tab === 'videos'     ? 'block' : 'none';
  document.getElementById('categoriesTab').style.display = tab === 'categories' ? 'block' : 'none';
  document.getElementById('addVideoBtn').style.display   = tab === 'videos'     ? 'flex'  : 'none';
  if (tab === 'categories') renderCategories();
};

/* ── FETCH ── */
window.fetchVideos = async function() {
  document.getElementById('videoList').innerHTML = '<div class="skeleton" style="height:70px"></div>'.repeat(3);
  document.getElementById('listCount').textContent = 'Loading...';
  try {
    const snap = await getDocs(query(collection(db, 'videos'), orderBy('title')));
    videos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    selectedIds.clear();
    renderList();
    populateCatDropdowns();
    if (currentTab === 'categories') renderCategories();
  } catch(e) {
    console.error(e);
    showToast('❌ Failed to load. Check Firestore rules.');
    document.getElementById('listCount').textContent = 'Error';
    document.getElementById('videoList').innerHTML = '';
  }
};

/* ── RENDER VIDEO LIST ── */
function renderList() {
  const q = (document.getElementById('searchBox')?.value || '').toLowerCase().trim();
  const filtered = q ? videos.filter(v => (v.title||'').toLowerCase().includes(q) || getCh(v).toLowerCase().includes(q)) : videos;

  document.getElementById('listCount').textContent = `${filtered.length} of ${videos.length} video${videos.length !== 1 ? 's' : ''}`;
  document.getElementById('selectAllRow').style.display = filtered.length ? 'flex' : 'none';
  document.getElementById('selectAllCb').checked = filtered.length > 0 && filtered.every(v => selectedIds.has(v.id));
  updateBulkBar();

  document.getElementById('videoList').innerHTML = filtered.length === 0
    ? '<div style="text-align:center;padding:60px 20px;color:#555">No videos found.</div>'
    : filtered.map(v => `
    <div class="video-item${editId === v.id ? ' editing' : ''}${selectedIds.has(v.id) ? ' selected' : ''}" id="item-${v.id}">
      <div class="cb-wrap">
        <input type="checkbox" data-id="${v.id}" ${selectedIds.has(v.id) ? 'checked' : ''} onchange="toggleSelect('${v.id}',this.checked)" />
      </div>
      <img class="video-thumb" src="${v.thumb||''}" alt="" onerror="this.src='https://placehold.co/72x42/111/444?text=img'" />
      <div class="video-meta">
        <div class="video-title">${v.title || 'Untitled'}</div>
        <div class="video-sub">
          <span>📺 ${getCh(v)||'—'}</span>
          <span>⏱ ${v.duration||'—'}</span>
          <span>👍 ${v.likes||0} 👎 ${v.dislikes||0} 👁 ${fmtNum(v.views||0)}</span>
        </div>
      </div>
      <div class="item-btns">
        <a href="video.html?id=${v.id}" target="_blank" class="btn-icon btn-view">
          <svg class="icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </a>
        <button class="btn-icon btn-edit" onclick="openEdit('${v.id}')">
          <svg class="icon" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="btn-icon btn-del" onclick="deleteVideo('${v.id}')">
          <svg class="icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </div>
    </div>`).join('');
}

/* ── BULK SELECT ── */
window.toggleSelect = function(id, checked) {
  if (checked) selectedIds.add(id); else selectedIds.delete(id);
  const item = document.getElementById('item-' + id);
  if (item) item.classList.toggle('selected', checked);
  updateBulkBar();
  const q = (document.getElementById('searchBox')?.value || '').toLowerCase().trim();
  const filtered = q ? videos.filter(v => (v.title||'').toLowerCase().includes(q) || getCh(v).toLowerCase().includes(q)) : videos;
  document.getElementById('selectAllCb').checked = filtered.length > 0 && filtered.every(v => selectedIds.has(v.id));
};

window.toggleSelectAll = function(checked) {
  const q = (document.getElementById('searchBox')?.value || '').toLowerCase().trim();
  const filtered = q ? videos.filter(v => (v.title||'').toLowerCase().includes(q) || getCh(v).toLowerCase().includes(q)) : videos;
  filtered.forEach(v => { if (checked) selectedIds.add(v.id); else selectedIds.delete(v.id); });
  renderList();
};

window.clearSelection = function() {
  selectedIds.clear();
  document.getElementById('selectAllCb').checked = false;
  renderList();
};

function updateBulkBar() {
  const bar = document.getElementById('bulkBar');
  const n = selectedIds.size;
  if (n > 0) {
    bar.classList.add('show');
    document.getElementById('bulkCount').textContent = `${n} video${n > 1 ? 's' : ''} selected`;
  } else {
    bar.classList.remove('show');
  }
}

/* ── ASSIGN MODAL ── */
window.openAssignModal = function() {
  populateCatDropdowns();
  document.getElementById('newCatInput').value = '';
  document.getElementById('existingCatSelect').value = '';
  document.getElementById('assignSubText').textContent = `Assign category to ${selectedIds.size} selected video${selectedIds.size > 1 ? 's' : ''}`;
  document.getElementById('assignModal').classList.add('show');
};

window.closeAssignModal = function() {
  document.getElementById('assignModal').classList.remove('show');
};

window.confirmAssign = async function() {
  const existing = document.getElementById('existingCatSelect').value.trim();
  const newName  = document.getElementById('newCatInput').value.trim();
  const category = newName || existing;
  if (!category) { showToast('⚠️ Enter or select a category name'); return; }
  if (selectedIds.size === 0) { closeAssignModal(); return; }

  const btn = document.getElementById('assignConfirmBtn');
  btn.disabled = true; btn.textContent = 'Saving...';

  try {
    const batch = writeBatch(db);
    selectedIds.forEach(id => {
      batch.update(doc(db, 'videos', id), { channel: category });
    });
    await batch.commit();

    // update local data
    const ids = [...selectedIds];
    videos.forEach(v => { if (ids.includes(v.id)) v.channel = category; });

    if (newName && !extraCategories.includes(newName)) {
      extraCategories.push(newName);
    }

    showToast(`✅ "${category}" assigned to ${ids.length} video${ids.length > 1 ? 's' : ''}`);
    closeAssignModal();
    clearSelection();
    populateCatDropdowns();
    renderList();
    if (currentTab === 'categories') renderCategories();
  } catch(e) {
    console.error(e);
    showToast('❌ Failed. Check Firestore rules.');
  } finally {
    btn.disabled = false; btn.textContent = 'Assign';
  }
};

/* ── VIDEO FORM ── */
window.openAdd = function() {
  editId = null;
  ['title','src','thumb','preview','duration','channel','keywords'].forEach(k => document.getElementById('f-'+k).value = '');
  document.getElementById('f-views').value = '0';
  document.getElementById('f-desc').value = '';
  document.getElementById('f-channel-pick').value = '';
  document.getElementById('formTitle').textContent = '➕ Add New Video';
  document.getElementById('saveBtnText').textContent = 'Add Video';
  document.getElementById('formCard').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(() => document.getElementById('f-title').focus(), 100);
};

window.openEdit = function(id) {
  const v = videos.find(x => x.id === id);
  if (!v) return;
  editId = id;
  document.getElementById('f-title').value    = v.title || '';
  document.getElementById('f-src').value      = v.src || '';
  document.getElementById('f-thumb').value    = v.thumb || '';
  document.getElementById('f-preview').value  = v.preview || '';
  document.getElementById('f-duration').value = v.duration || '';
  document.getElementById('f-channel').value  = getCh(v);
  document.getElementById('f-views').value    = v.views || 0;
  document.getElementById('f-keywords').value = v.keywords || '';
  document.getElementById('f-desc').value     = v.description || '';
  document.getElementById('f-channel-pick').value = '';
  document.getElementById('formTitle').textContent = '✏️ Edit Video';
  document.getElementById('saveBtnText').textContent = 'Update Video';
  document.getElementById('formCard').style.display = 'block';
  renderList();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.closeForm = function() {
  editId = null;
  document.getElementById('formCard').style.display = 'none';
  renderList();
};

window.saveVideo = async function() {
  const title = document.getElementById('f-title').value.trim();
  const src   = document.getElementById('f-src').value.trim();
  const thumb = document.getElementById('f-thumb').value.trim();
  if (!title || !src || !thumb) { showToast('⚠️ Title, Video URL and Thumbnail required'); return; }
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  document.getElementById('saveBtnText').textContent = 'Saving...';
  try {
    const data = {
      title, src, thumb,
      preview:     document.getElementById('f-preview').value.trim(),
      duration:    document.getElementById('f-duration').value.trim(),
      channel:     document.getElementById('f-channel').value.trim(),
      views:       parseInt(document.getElementById('f-views').value) || 0,
      keywords:    document.getElementById('f-keywords').value.trim(),
      description: document.getElementById('f-desc').value.trim(),
      likes: editId ? undefined : 0,
      dislikes: editId ? undefined : 0,
    };
    if (!editId) { data.likes = 0; data.dislikes = 0; }
    if (editId) {
      delete data.likes; delete data.dislikes;
      await updateDoc(doc(db, 'videos', editId), data);
      showToast('✅ Video updated!');
    } else {
      await addDoc(collection(db, 'videos'), { ...data, createdAt: serverTimestamp() });
      showToast('✅ Video added!');
    }
    closeForm();
    fetchVideos();
  } catch(e) {
    console.error(e);
    showToast('❌ Failed. Check Firestore write rules.');
  } finally {
    btn.disabled = false;
    document.getElementById('saveBtnText').textContent = editId ? 'Update Video' : 'Add Video';
  }
};

window.deleteVideo = async function(id) {
  if (!confirm('Delete this video permanently?')) return;
  try {
    await deleteDoc(doc(db, 'videos', id));
    videos = videos.filter(v => v.id !== id);
    selectedIds.delete(id);
    showToast('🗑️ Deleted');
    renderList();
    if (currentTab === 'categories') renderCategories();
  } catch(e) {
    console.error(e);
    showToast('❌ Delete failed.');
  }
};

/* ── CATEGORIES TAB ── */
function renderCategories() {
  const cats = getAllCategories();
  document.getElementById('catListTitle').textContent = `Categories (${cats.length})`;
  if (cats.length === 0) {
    document.getElementById('catItems').innerHTML = '<div style="text-align:center;padding:40px;color:#555">No categories yet.</div>';
    return;
  }
  document.getElementById('catItems').innerHTML = cats.map(cat => {
    const count = videos.filter(v => getCh(v).toLowerCase() === cat.toLowerCase()).length;
    return `<div class="cat-item" id="catrow-${encodeURIComponent(cat)}">
      <div class="cat-name" id="catname-${encodeURIComponent(cat)}">${cat}</div>
      <div class="cat-count">${count} video${count !== 1 ? 's' : ''}</div>
      <input class="cat-edit-input" id="catedit-${encodeURIComponent(cat)}" type="text" value="${cat}" style="display:none" />
      <div class="cat-actions">
        <button class="btn-cat-edit" id="catbtn-edit-${encodeURIComponent(cat)}" onclick="startEditCat('${encodeURIComponent(cat)}')">✏️ Rename</button>
        <button class="btn-cat-save" id="catbtn-save-${encodeURIComponent(cat)}" onclick="saveEditCat('${encodeURIComponent(cat)}','${cat}')">💾 Save</button>
        <button class="btn-cat-del" onclick="deleteCategory('${cat}')">🗑️ Delete</button>
      </div>
    </div>`;
  }).join('');
}

window.addNewCategory = function() {
  const name = document.getElementById('newCatName').value.trim();
  if (!name) { showToast('⚠️ Enter a category name'); return; }
  const exists = getAllCategories().some(c => c.toLowerCase() === name.toLowerCase());
  if (exists) { showToast('⚠️ Category already exists'); return; }
  extraCategories.push(name);
  document.getElementById('newCatName').value = '';
  populateCatDropdowns();
  renderCategories();
  showToast(`✅ "${name}" added to categories`);
};

window.startEditCat = function(enc) {
  const cat = decodeURIComponent(enc);
  document.getElementById('catname-' + enc).style.display = 'none';
  document.getElementById('catedit-' + enc).style.display = 'block';
  document.getElementById('catbtn-edit-' + enc).style.display = 'none';
  document.getElementById('catbtn-save-' + enc).style.display = 'block';
  document.getElementById('catedit-' + enc).focus();
};

window.saveEditCat = async function(enc, oldCat) {
  const newCat = document.getElementById('catedit-' + enc).value.trim();
  if (!newCat) { showToast('⚠️ Category name cannot be empty'); return; }
  if (newCat.toLowerCase() === oldCat.toLowerCase()) {
    document.getElementById('catname-' + enc).style.display = 'block';
    document.getElementById('catedit-' + enc).style.display = 'none';
    document.getElementById('catbtn-edit-' + enc).style.display = 'block';
    document.getElementById('catbtn-save-' + enc).style.display = 'none';
    return;
  }

  const affected = videos.filter(v => getCh(v).toLowerCase() === oldCat.toLowerCase());
  if (!confirm(`Rename "${oldCat}" → "${newCat}"? This will update ${affected.length} video${affected.length !== 1 ? 's' : ''}.`)) return;

  const btn = document.getElementById('catbtn-save-' + enc);
  btn.disabled = true; btn.textContent = 'Saving...';

  try {
    if (affected.length > 0) {
      const batch = writeBatch(db);
      affected.forEach(v => batch.update(doc(db, 'videos', v.id), { channel: newCat }));
      await batch.commit();
      affected.forEach(v => { v.channel = newCat; });
    }
    // update extraCategories
    const ei = extraCategories.findIndex(c => c.toLowerCase() === oldCat.toLowerCase());
    if (ei !== -1) extraCategories[ei] = newCat;

    showToast(`✅ Renamed to "${newCat}" (${affected.length} videos updated)`);
    populateCatDropdowns();
    renderCategories();
  } catch(e) {
    console.error(e);
    showToast('❌ Failed. Check Firestore rules.');
  } finally {
    btn.disabled = false; btn.textContent = '💾 Save';
  }
};

window.deleteCategory = async function(cat) {
  const affected = videos.filter(v => getCh(v).toLowerCase() === cat.toLowerCase());
  const action = affected.length > 0
    ? `Delete category "${cat}"? This will clear the channel from ${affected.length} video${affected.length !== 1 ? 's' : ''}.`
    : `Remove category "${cat}"?`;
  if (!confirm(action)) return;

  try {
    if (affected.length > 0) {
      const batch = writeBatch(db);
      affected.forEach(v => batch.update(doc(db, 'videos', v.id), { channel: '' }));
      await batch.commit();
      affected.forEach(v => { v.channel = ''; });
    }
    extraCategories = extraCategories.filter(c => c.toLowerCase() !== cat.toLowerCase());
    showToast(`🗑️ "${cat}" deleted`);
    populateCatDropdowns();
    renderCategories();
    renderList();
  } catch(e) {
    console.error(e);
    showToast('❌ Failed. Check Firestore rules.');
  }
};
</script>
